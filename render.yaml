services:
  - type: web
    name: annotate-pay-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLRATES_API_KEY
        sync: false
      - key: FX_CACHE_TTL_SECONDS
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.8"
